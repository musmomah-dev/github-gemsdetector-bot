name: Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8,14,20 * * *'  # Tourne à 8h, 14h et 20h UTC (ce qui fait environ 10h, 16h et 22h en Tunisie)

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}  # <-- C'est cette ligne qu'il faut ajouter !
        run: python main.py
